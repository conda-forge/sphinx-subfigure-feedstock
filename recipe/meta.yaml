{% set name = "sphinx-subfigure" %}
{% set version = "0.3.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/sphinx_subfigure-{{ version }}.tar.gz
  sha256: f04ea90a2f0683751afb5aaadcb9bb8c64dbf0e954e7191457ec0ce4373d60e0

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - flit-core >=3.4,<4
    - python >=3.7
    - pip
  run:
    - python >=3.7
    - sphinx

test:
  imports:
    - sphinx_subfigure
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/chrisjsewell/sphinx-subfigure
  summary: A sphinx extension to create sub-figures.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - chrisjsewell
